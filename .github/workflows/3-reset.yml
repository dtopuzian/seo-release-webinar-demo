name: '3. Вернуть обе витрины к v1'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webinar-demo
  queue: max
  cancel-in-progress: false
env:
  DEMO_RUNTIME_SHA: '0ad995c6d52c95d2e1c09af04e06337b8d0342f5'
  DEMO_VARIANT: 'good'
jobs:
  release:
    name: 'Выпуск'
    if: ${{ github.repository == 'dtopuzian/seo-release-webinar-demo' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Подготовка'
        id: prepare
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          python3 -B ci/run.py prepare unsafe
          python3 -B ci/run.py prepare checked
      - name: 'SEO-проверка'
        id: check
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          python3 -B ci/run.py check unsafe
          python3 -B ci/run.py check checked
      - name: 'Публикация'
        id: publish
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          python3 -B ci/run.py release unsafe
          python3 -B ci/run.py release checked
      - name: 'Результат'
        id: status
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          result=0
          python3 -B ci/run.py status unsafe || result=1
          python3 -B ci/run.py status checked || result=1
          exit "$result"
