name: '1. Выпустить без SEO-проверки'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webinar-demo
  queue: max
  cancel-in-progress: false
env:
  DEMO_RUNTIME_SHA: '5735c1ed556ec870df43f45cae912361966f84b7'
  DEMO_VARIANT: 'bad'
jobs:
  release:
    name: 'Выпуск'
    if: ${{ github.repository == 'dtopuzian/seo-release-webinar-demo' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Подготовка'
        id: prepare
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          python3 -B ci/run.py prepare unsafe
      - name: 'Публикация'
        id: publish
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          DEMO_SSH_KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          python3 -B ci/run.py release unsafe
