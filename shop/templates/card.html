<article class="product-card">
  <a class="product-visual {{COLOR}}" href="{{ID}}.html"><span class="product-label">{{LABEL}}</span><img src="assets/{{ID}}.svg" alt="{{TYPE}} {{NAME}}" width="480" height="480" loading="lazy"><span class="visual-arrow" aria-hidden="true">↗</span></a>
  <div class="product-info"><div><p class="product-type">{{TYPE}}</p><h3><a href="{{ID}}.html">{{NAME}}</a></h3><p class="product-material">{{MATERIAL}}</p></div><div class="product-purchase"><span>{{PRICE}}</span><button type="button" class="add-small" data-add="{{ID}}" aria-label="Добавить {{NAME}} в корзину">+</button></div></div>
</article>
